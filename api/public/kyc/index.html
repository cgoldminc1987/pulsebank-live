<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulseBank — Verify your identity</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0a1211; color:#e6f2f1; font:16px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif; padding:24px; }
  .card { width:100%; max-width:420px; background:#0f1a19; border:1px solid #1e2f2d; border-radius:16px; padding:28px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.sub { color:#9db8b5; font-size:14px; margin:0 0 20px; }
  label { display:block; font-size:13px; color:#9db8b5; margin:14px 0 6px; }
  input, select { width:100%; padding:11px 12px; border:1px solid #2a3a3a; border-radius:10px;
                  background:#0d1616; color:#e6f2f1; font-size:15px; }
  button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:10px;
           background:#2dd4bf; color:#04211d; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .fine { color:#7a9491; font-size:12px; margin-top:16px; line-height:1.5; }
  .err { background:#3a1420; border:1px solid #7f1d3a; color:#fbcfe8; border-radius:10px;
         padding:10px 12px; font-size:13px; margin-top:14px; display:none; }
  .ok { color:#2dd4bf; font-size:13px; margin-top:14px; display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Verify your identity</h1>
  <p class="sub">Required before a reloadable card can be issued ($1,000+ program rule). Takes about 2 minutes.</p>

  <form id="f">
    <label for="reference">Your email</label>
    <input id="reference" type="email" required autocomplete="email" placeholder="you@example.com">

    <label for="account_type">What is this verification for?</label>
    <select id="account_type">
      <option value="reloadable_card">Reloadable card</option>
      <option value="merchant_payout">Merchant payouts</option>
      <option value="account_holder">Account holder</option>
    </select>

    <button id="go" type="submit">Start verification</button>
  </form>

  <div id="err" class="err"></div>
  <div id="ok" class="ok"></div>

  <p class="fine">
    Your government ID and selfie are captured by Stripe's secure hosted flow.
    PulseBank never sees or stores the document — only the pass/fail result and
    your verified name.
  </p>
</div>

<script>
var form = document.getElementById('f');
var btn = document.getElementById('go');
var err = document.getElementById('err');
var ok = document.getElementById('ok');

// Prefill ?reference= from a link (decline email, terminal deep link, QR)
var ref = new URLSearchParams(location.search).get('reference');
if (ref) document.getElementById('reference').value = ref;

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  err.style.display = 'none'; ok.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Starting…';
  var reference = document.getElementById('reference').value.trim().toLowerCase();
  try {
    var r = await fetch('/api/v1/kyc/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reference: reference,
        email: reference,
        account_type: document.getElementById('account_type').value
      })
    });
    var j = await r.json();
    if (!r.ok) {
      if (r.status === 409 && j.error === 'already_verified') {
        ok.style.display = 'block';
        ok.textContent = 'Already verified — you can close this page.';
        return;
      }
      if (j.error === 'identity_not_enabled') {
        throw new Error('Verification is being set up — try again shortly.');
      }
      throw new Error(j.message || j.error || ('Request failed (' + r.status + ')'));
    }
    if (j.url) { location.href = j.url; return; } // Stripe hosted verification page
    if (j.client_secret && window.Stripe) {
      // Fallback: direct Stripe.js integration
      var stripe = window.Stripe('<PK_PLACEHOLDER>');
      stripe.verifyIdentity(j.client_secret).then(function () {
        location.href = '/kyc/returned.html?reference=' + encodeURIComponent(reference);
      });
      return;
    }
    throw new Error('No verification url returned — use the refresh link.');
  } catch (ex) {
    err.style.display = 'block';
    err.textContent = ex.message;
    btn.disabled = false; btn.textContent = 'Start verification';
  }
});
</script>
</body>
</html>
